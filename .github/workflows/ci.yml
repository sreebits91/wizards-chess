name: CI
on:
  push:
    branches: [main, "complete/**"]
  pull_request:
    branches: [main]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate required files
        run: test -f index.html && test -f app.js && test -f styles.css
      - name: JavaScript syntax
        run: node --check app.js
      - name: Static HTTP smoke test
        run: |
          python3 -m http.server 8080 >/tmp/server.log 2>&1 &
          PID=$!
          trap 'kill $PID' EXIT
          sleep 1
          curl --fail http://127.0.0.1:8080/ >/dev/null
          curl --fail http://127.0.0.1:8080/app.js >/dev/null
